<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hakuna Matata</title>
<meta name="theme-color" content="#FBF5EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hakuna Matata">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5EF; --card:#FFFFFF; --ink:#2E1F16; --muted:#7A6656; --line:#E6D6C6;
  --sand:#F3E6D6; --sand2:#F1E7DC; --pink:#C8325F; --pink-soft:#FCE4EC; --fire:#FF7A1A; --fire-text:#C2510A; --gold:#FFC23D;
}
*{box-sizing:border-box}
html,body{margin:0;background:#EFE5DA;color:var(--ink);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;color:var(--ink)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
:focus-visible{outline:3px solid #2E1F16;outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 130px)}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g20{gap:20px}.g22{gap:22px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 4px 18px rgba(46,31,22,.06)}
h1,h2,h3{margin:0}
.h1{font-size:26px;font-weight:800}
.h2{font-size:20px;font-weight:700}
.btn{height:48px;border-radius:24px;border:none;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.btn-pink{background:var(--pink);color:#fff}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:500}
.btn-sm{height:44px;font-size:15px;padding:0 16px;border-radius:22px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--bg);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.chip{height:34px;padding:0 12px;border-radius:17px;border:none;background:var(--sand);font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg)}
.tag{height:24px;padding:0 10px;border-radius:12px;background:var(--sand);font-size:12px;display:inline-flex;align-items:center;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}
.input{height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;outline:none;width:100%}
.input:focus{border-color:var(--pink)}
.label-sm{font-size:13px;font-weight:600;color:var(--pink)}

/* header */
.avatar{width:56px;height:56px;border-radius:50%;background:var(--pink-soft);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex-shrink:0}
.avatar img{width:62px;height:62px;object-fit:cover;object-position:top;margin-bottom:-6px}
.avatar-logo{background:#fff;box-shadow:0 0 0 1px var(--line)}
.avatar-logo img{width:100%;height:100%;object-fit:cover;object-position:center;margin-bottom:0}
.streak-pill{height:44px;padding:0 16px;border-radius:22px;border:none;background:#fff;box-shadow:0 2px 10px rgba(46,31,22,.08);display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border:none;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.day .l{font-size:13px;font-weight:500;color:var(--muted)}
.day.today .l{color:var(--pink);font-weight:700}
.day .c{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--sand2);transition:all .2s}
.day.today .c{box-shadow:inset 0 0 0 2px var(--pink)}
.day.sel .c{background:var(--pink);color:#fff;box-shadow:none}
.day.done .c{background:var(--ink);color:#fff}
.day.done.sel .c{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pink)}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.day.planned .dot{background:var(--fire)}

/* hero */
.hero{position:relative;border:none;text-align:right;border-radius:28px;background:var(--ink);color:var(--bg);padding:22px 22px 22px 130px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;margin-top:14px;width:100%}
.hero img{position:absolute;left:4px;bottom:0;width:132px;height:150px;object-fit:contain;object-position:bottom;animation:bob 2.6s ease-in-out infinite}
.hero .pill{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:rgba(255,122,26,.18);color:#FFB37A;font-size:13px;font-weight:600}
.hero .t{font-size:26px;font-weight:700;line-height:1.15}
.hero .s{font-size:14px;color:#D9C8B8}
.bar{height:8px;border-radius:4px;background:rgba(251,245,239,.15);overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px;background:var(--fire)}

/* workout */
.workout{border:2px solid transparent}
.workout.done{border-color:var(--ink)}
.wbadge{width:48px;height:48px;border-radius:16px;background:var(--pink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.workout.done .wbadge{background:var(--ink)}
.whead{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:none;background:transparent;padding:0;text-align:right}
.wchev{display:inline-flex;color:var(--muted);transition:transform .22s ease;flex-shrink:0}
.workout.open .wchev{transform:rotate(180deg)}
.ex{background:var(--bg);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;align-items:center;gap:4px;background:#fff;border-radius:22px;padding:3px}
.stepper button{width:38px;height:38px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center}
.sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.set{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:14px;padding:8px 4px;font-size:12px;color:var(--muted)}
.set input{width:52px;height:32px;border:none;border-radius:10px;background:var(--pink-soft);text-align:center;font-size:17px;font-weight:700;outline:none}
.set input:focus{box-shadow:0 0 0 2px var(--pink)}
.setno{border:1px dashed var(--line);background:transparent;border-radius:9px;height:20px;padding:0 7px;font-size:11px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center}
.set.warm{background:#FDF0DF}
.set.warm .setno{border-style:solid;border-color:#EFC08A;background:#FBE2C4;color:var(--fire-text)}
.set.warm input{background:#F7D9B4}
.dashed{height:48px;border-radius:18px;border:2px dashed var(--line);background:transparent;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.big{height:52px;border-radius:26px;width:100%}

/* list rows */
.lrow{background:#fff;border-radius:18px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:10px}
.lrow .icon-btn{background:transparent}

/* coach */
.coach{background:var(--ink);color:var(--bg);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px}
.coach .head img{width:72px;height:72px;object-fit:contain;flex-shrink:0}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:2px}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.55;white-space:normal;word-wrap:break-word}
.msg.u{align-self:flex-start;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-end;background:#3E2C21;color:#F7EEE5;border-bottom-left-radius:6px}
.msg.err{background:#4A2A22;color:#FFD9C7}
.coach .chip{background:rgba(251,245,239,.1);color:var(--bg)}
.coach .input{background:rgba(251,245,239,.08);border-color:rgba(251,245,239,.18);color:var(--bg)}
.coach .input::placeholder{color:#BFAE9E}
.addex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.addex button{height:34px;padding:0 12px;border-radius:17px;border:none;background:rgba(255,122,26,.2);color:#FFC9A1;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.addex button[disabled]{background:rgba(251,245,239,.08);color:#BFAE9E;cursor:default}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#D9C8B8;margin:0 2px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}

/* streak */
.sbig{position:relative;border-radius:30px;background:var(--ink);color:var(--bg);padding:24px;display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.45),rgba(255,122,26,0) 70%);animation:glow 2.4s ease-in-out infinite}
.mile{border:none;text-align:right;background:#fff;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:14px;width:100%}
.mbadge{width:52px;height:52px;border-radius:16px;background:var(--sand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mile.got .mbadge{background:var(--ink)}
.mbar{height:6px;border-radius:3px;background:var(--sand);overflow:hidden}
.mbar span{display:block;height:100%;border-radius:3px;background:var(--pink)}
.mile.got .mbar span{background:var(--fire)}

/* nav */
.nav{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:34px;background:#fff;box-shadow:0 8px 28px rgba(46,31,22,.16);z-index:20;transition:opacity .18s ease,transform .18s ease,visibility .18s}
body.kb .nav{opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(140%)}
.nav button{height:52px;min-width:52px;padding:0 14px;border-radius:26px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;transition:all .2s}
.nav button.on{background:var(--pink);color:#fff;padding:0 18px}
.nav button .lbl{display:none}
.nav button.on .lbl{display:inline}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(46,31,22,.45)}
.sheet{max-width:440px;width:100%;margin:0 auto;height:min(680px,88dvh);background:var(--bg);border-radius:32px 32px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:14px;animation:rise .25s ease-out}
.sheet .list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.pick{border:none;text-align:right;min-height:54px;border-radius:16px;background:#fff;padding:8px 16px;display:flex;align-items:center;gap:10px;width:100%}
.plus{width:34px;height:34px;border-radius:50%;background:var(--pink-soft);color:var(--pink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.celeb{position:fixed;inset:0;z-index:50;background:rgba(46,31,22,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.celeb .box{width:100%;max-width:380px;background:var(--bg);border-radius:34px;padding:28px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:18px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(46,31,22,.25);animation:drop .3s ease-out;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@keyframes rise{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes drop{0%{transform:translate(-50%,-20px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

}

function cmpVer(a, b) {

/* ---------- data actions ---------- */
function commit() { save(); render(); }
function findW(id) { return (S.logs[ui.sel] || []).filter(function (w) { return w.id === id; })[0]; }
function findE(w, id) { return w && w.ex.filter(function (e) { return e.id === id; })[0]; }
function cleanDays() { Object.keys(S.logs).forEach(function (k) { if (!S.logs[k] || !S.logs[k].length) delete S.logs[k]; }); }
function checkMilestone() {
  var n = streakNow();
  if (MILESTONES.indexOf(n) >= 0 && S.seen.indexOf(n) < 0) { S.seen.push(n); ui.celebrate = n; }
}
function addExercise(name) {
  var w = findW(ui.sheetFor); name = (name || '').trim();
  if (!w || !name) return;
  w.ex.push(mkEx(name, [10, 10, 10]));
  ui.sheetFor = null; ui.search = '';
  commit(); toast('נוסף: ' + name);
}
function backupPayload() {
  return { app: APP, format: 'hakuna-matata-backup', version: 1, exportedAt: new Date().toISOString(),
    data: { logs: S.logs, library: S.library, seen: S.seen, chat: S.chat } };
}
function backupFile() {
  return new File([JSON.stringify(backupPayload(), null, 2)], 'hakuna-matata-backup-' + dkey(new Date()) + '.json', { type: 'application/json' });
}
function doExport() {
  var f = backupFile(), url = URL.createObjectURL(f), a = document.createElement('a');
  a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  S.lastBackup = new Date().toISOString(); commit(); toast('קובץ הגיבוי ירד למכשיר');
}
function doShare() {
  var f = backupFile();
  navigator.share({ files: [f], title: APP + ' backup' }).then(function () {
    S.lastBackup = new Date().toISOString(); commit(); toast('הגיבוי נשמר');
  }).catch(function () {});
}
function doImport(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var j = JSON.parse(r.result), d = j && j.data ? j.data : j;
      if (!d || typeof d.logs !== 'object' || !Array.isArray(d.library)) throw new Error('bad');
      if (!confirm('לשחזר מהקובץ? הנתונים הנוכחיים יוחלפו בנתוני הגיבוי.')) return;
      var keep = S.settings;
      S = normalize(d); S.settings = keep; S.lastBackup = j.exportedAt || new Date().toISOString();
      ui.sel = dkey(new Date()); ui.weekOffset = 0;
      commit(); toast('הנתונים שוחזרו מהגיבוי');
    } catch (e) { toast('הקובץ הזה לא נראה כמו גיבוי של ' + APP); }
  };
  r.readAsText(file);
}

/* ---------- AI coach ---------- */
function coachSystem() {
  var recent = [], now = new Date();
  for (var i = 0; i < 14; i++) {
    var k = dkey(addDays(now, -i)), ws = S.logs[k] || [];
    ws.forEach(function (w) {
      recent.push(k + ' — ' + w.name + (w.done ? ' (בוצע)' : ' (מתוכנן)') + ': ' + w.ex.map(function (e) { return e.name + ' ' + e.sets.length + 'x' + (e.sets[0] || '?'); }).join(', '));
    });
  }
  return [
    'אתה מאמן הכושר האישי של טל בתוך אפליקציית האימונים שלה, ' + APP + '. הקמע של האפליקציה הוא סוריקטה חמודה עם פפיון ורוד.',
    'עני תמיד בעברית, בגוף שני נקבה (את, תעשי, נסי), בטון חם, מעודד וענייני. תשובות קצרות וממוקדות: עד כ-150 מילים, עם רשימות קצרות כשזה עוזר. אל תשתמש באימוג׳י.',
    'אתה עוזר עם: בחירת תרגילים לפי אזור בגוף, טכניקה נכונה וטעויות נפוצות, סטים וחזרות, תכנון אימון, חימום ומתיחות, והתקדמות.',
    'אם טל מתארת כאב, פציעה או מצב רפואי, הצע חלופות עדינות והמלץ לפנות לרופא או לפיזיותרפיסט. אל תאבחן.',
    'התפריט השמור שלה: ' + S.library.map(function (l) { return l.name + ' (' + l.cat + ')'; }).join(', ') + '.',
    recent.length ? 'האימונים שלה בשבועיים האחרונים:\n' + recent.join('\n') : 'אין לה עדיין אימונים רשומים בשבועיים האחרונים.',
    'כשאתה ממליץ על תרגילים ספציפיים, הוסף בסוף התשובה בלוק במבנה הזה בדיוק, שורה לכל תרגיל (עד 6), עם קטגוריה אחת מתוך: ' + CATS.join(', ') + '.',
    '<ex>\nשם התרגיל|קטגוריה\n</ex>',
    'אל תזכיר את הבלוק בטקסט עצמו. אם לא המלצת על תרגילים, אל תוסיף אותו.'
  ].join('\n\n');
}
function parseCoach(text) {
  var ex = [], m = text.match(/<ex>([\s\S]*?)<\/ex>/);
  if (m) {
    m[1].split('\n').forEach(function (line) {
      var p = line.split('|'); var n = (p[0] || '').trim(); var c = (p[1] || '').trim();
      if (n) ex.push({ name: n, cat: CATS.indexOf(c) >= 0 ? c : 'אחר' });
    });
    text = text.replace(m[0], '').trim();
  }
  return { text: text, ex: ex.slice(0, 6) };
}
function askCoach(q) {
  q = (q || '').trim(); if (!q || ui.busy) return;
  S.chat.push({ role: 'user', text: q });
  if (!S.settings.apiKey) {
    S.chat.push({ role: 'assistant', local: true, text: 'כדי שאוכל לענות, צריך להוסיף מפתח API של OpenRouter בלשונית ההגדרות. אחרי זה פשוט תשאלי שוב.' });
    commit(); return;
  }
  ui.busy = true; commit();
  var hist = S.chat.filter(function (m) { return !m.local; }).slice(-14).map(function (m) { return { role: m.role, content: m.text }; });
  while (hist.length && hist[0].role !== 'user') hist.shift();
  fetch(OR_URL, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'authorization': 'Bearer ' + S.settings.apiKey,
      'HTTP-Referer': location.origin + location.pathname,
      'X-Title': APP
    },
    body: JSON.stringify({
      model: S.settings.model || DEFAULT_MODEL,
      max_tokens: 2000,
      reasoning: { effort: S.settings.effort || DEFAULT_EFFORT },
      messages: [{ role: 'system', content: coachSystem() }].concat(hist)
    })
  }).then(function (r) {
    return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
  }).then(function (res) {
    if (!res.ok) {
      var msg = res.status === 401 ? 'המפתח לא התקבל. כדאי לבדוק אותו בהגדרות.' :
        res.status === 402 ? 'נגמרה היתרה בחשבון OpenRouter. כדאי לבדוק את היתרה.' :
        res.status === 404 ? 'המודל שבהגדרות לא נמצא. נסי שם מודל אחר.' :
        res.status === 429 ? 'יותר מדי בקשות כרגע. נסי שוב בעוד רגע.' :
        'משהו השתבש (' + res.status + '). ' + ((res.j && res.j.error && res.j.error.message) || '');
      S.chat.push({ role: 'assistant', local: true, text: msg });
    } else {
      var cm = res.j.choices && res.j.choices[0] && res.j.choices[0].message;
      var t = ((cm && cm.content) || '').trim();
      var p = parseCoach(t);
      S.chat.push({ role: 'assistant', text: p.text || '...', ex: p.ex });
    }
  }).catch(function () {
    S.chat.push({ role: 'assistant', local: true, text: 'אין חיבור למאמן כרגע. בדקי את האינטרנט ונסי שוב.' });
  }).then(function () {
    if (S.chat.length > 60) S.chat = S.chat.slice(-60);
    ui.busy = false; commit();
  });
}

/* ---------- events ---------- */
document.addEventListener('click', function (ev) {
  if (Date.now() < suppressClickUntil) return; /* a swipe just happened */
  var b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  var a = b.dataset.a, w, e;
  switch (a) {
    case 'tab': ui.tab = b.dataset.t; ui.sheetFor = null; render(); window.scrollTo(0, 0); break;
    case 'day': ui.sel = b.dataset.k; ui.newOpen = false; render(); break;
    case 'weekPrev': ui.weekOffset--; render(); break;
    case 'weekNext': ui.weekOffset++; render(); break;
    case 'today': ui.weekOffset = 0; ui.sel = dkey(new Date()); render(); break;
    case 'openNew': ui.newOpen = true; render(); focusNewName(); break;
    case 'closeNew': ui.newOpen = false; render(); break;
    case 'quick': var inp = document.getElementById('newName'); if (inp) { inp.value = b.dataset.n; focusNewName(); } break;
    case 'createWorkout':
      var nm = (document.getElementById('newName').value || '').trim() || 'אימון';
      (S.logs[ui.sel] = S.logs[ui.sel] || []).push({ id: uid(), name: nm, done: false, ex: [] });
      ui.newOpen = false; commit(); break;
    case 'delW':
      w = findW(b.dataset.w);
      if (w && (!w.ex.length || confirm('למחוק את "' + w.name + '"?'))) {
        S.logs[ui.sel] = S.logs[ui.sel].filter(function (x) { return x.id !== w.id; }); cleanDays(); commit();
      }
      break;
    case 'toggleW': w = findW(b.dataset.w); if (w) { w.done = !w.done; if (w.done) { delete ui.doneOpen[w.id]; checkMilestone(); } commit(); if (w.done && !ui.celebrate) toast('כל הכבוד! האימון סומן כבוצע'); } break;
    case 'toggleDone': ui.doneOpen[b.dataset.w] = !ui.doneOpen[b.dataset.w]; render(); break;
    case 'delEx': w = findW(b.dataset.w); if (w) { w.ex = w.ex.filter(function (x) { return x.id !== b.dataset.e; }); commit(); } break;
    case 'inc': e = findE(findW(b.dataset.w), b.dataset.e); if (e) { if (!Array.isArray(e.warm)) e.warm = []; e.sets.push(e.sets.length ? e.sets[e.sets.length - 1] : '10'); e.warm.push(false); commit(); } break;
    case 'dec': e = findE(findW(b.dataset.w), b.dataset.e); if (e && e.sets.length > 1) { e.sets.pop(); if (Array.isArray(e.warm)) e.warm.pop(); commit(); } break;
    case 'toggleWarm':
      e = findE(findW(b.dataset.w), b.dataset.e);
      if (e) {
        if (!Array.isArray(e.warm)) e.warm = [];
        while (e.warm.length < e.sets.length) e.warm.push(false);
        e.warm[+b.dataset.i] = !e.warm[+b.dataset.i];
        commit();
      }
      break;
    case 'openSheet': ui.sheetFor = b.dataset.w; ui.search = ''; render(); break;
    case 'closeSheet': ui.sheetFor = null; render(); break;
    case 'addFromLib': addExercise(b.dataset.n); break;
    case 'libCat': ui.libCat = b.dataset.c;
      var keepName = document.getElementById('libName').value; render(); document.getElementById('libName').value = keepName; break;
    case 'delLib': S.library = S.library.filter(function (l) { return l.id !== b.dataset.id; }); commit(); break;
    case 'preview': ui.celebrate = +b.dataset.m; render(); break;
    case 'closeCeleb': ui.celebrate = null; render(); break;
    case 'coachChip': askCoach(b.dataset.q); break;
    case 'coachClear': S.chat = []; commit(); break;
    case 'coachAdd':
      var msg = S.chat[+b.dataset.m], x = msg && msg.ex && msg.ex[+b.dataset.j];
      if (x && !S.library.some(function (l) { return l.name === x.name; })) {
        S.library.unshift({ id: uid(), name: x.name, cat: x.cat }); commit(); toast('נשמר בתפריט: ' + x.name);
      }
      break;
    case 'setEffort':
      S.settings.effort = b.dataset.e; save();
      var grp = b.closest('[data-effort-group]');
      if (grp) [].forEach.call(grp.querySelectorAll('[data-a="setEffort"]'), function (x) {
        var on = x.dataset.e === b.dataset.e;
        x.classList.toggle('on', on); x.setAttribute('aria-pressed', on);
      });
      break;
    case 'checkUpdate': checkVersion(); break;
    case 'export': doExport(); break;
    case 'shareExport': doShare(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'resetAll':
      if (confirm('למחוק את כל האימונים, התפריט והשיחות? אי אפשר לבטל. כדאי לייצא גיבוי קודם.')) {
        var keep = S.settings; S = freshData(); S.settings = keep; commit(); toast('הנתונים נמחקו');
      }
      break;
  }
});

document.addEventListener('submit', function (ev) {
  var f = ev.target.dataset.form; if (!f) return;
  ev.preventDefault();
  if (f === 'coach') { askCoach(document.getElementById('coachInput').value); }
  else if (f === 'lib') {
    var n = document.getElementById('libName').value.trim(); if (!n) return;
    S.library.unshift({ id: uid(), name: n, cat: ui.libCat }); commit(); toast('נשמר בתפריט: ' + n);
  } else if (f === 'oneoff') {
    var o = document.getElementById('oneOff').value.trim(); if (!o) return;
    if (document.getElementById('saveOneOff').checked && !S.library.some(function (l) { return l.name === o; })) {
      S.library.unshift({ id: uid(), name: o, cat: 'אחר' });
    }
    addExercise(o);
  } else if (f === 'ai') {
    S.settings.apiKey = document.getElementById('apiKey').value.trim();
    S.settings.model = document.getElementById('model').value.trim() || DEFAULT_MODEL;
    if (!EFFORTS.some(function (x) { return x[0] === S.settings.effort; })) S.settings.effort = DEFAULT_EFFORT;
    commit(); toast('הגדרות ה-AI נשמרו');
  }
});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'newName') { ev.preventDefault(); document.querySelector('[data-a="createWorkout"]').click(); }
  if (ev.key === 'Escape') { if (ui.celebrate) { ui.celebrate = null; render(); } else if (ui.sheetFor) { ui.sheetFor = null; render(); } }
});

document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.dataset && t.dataset.reps) {
    var e = findE(findW(t.dataset.w), t.dataset.e);
    if (e) { e.sets[+t.dataset.i] = t.value; save(); }
  }
  if (t.id === 'importFile' && t.files && t.files[0]) { doImport(t.files[0]); t.value = ''; }
});

document.addEventListener('input', function (ev) {
  if (ev.target.id === 'search') { ui.search = ev.target.value; document.getElementById('sheetList').innerHTML = sheetListHtml(); }
});

/* ---------- swipe between days ---------- */
var suppressClickUntil = 0, wheelLockUntil = 0, wheelAcc = 0, wheelTimer, animating = false;
var drag = { on: false, x: 0, y: 0, dx: 0, axis: null, t: 0, w: 420 };

function once(fn) { var f = false; return function () { if (f) return; f = true; fn.apply(null, arguments); }; }
function screenEl() { return document.getElementById('screen'); }
function swipeAllowed() { return ui.tab === 'home' && !ui.sheetFor && !ui.celebrate && !animating; }
function swipeBlocked(el) { return !!(el && el.closest && el.closest('input,textarea,select,.msgs,.nav,.overlay,.sheet,.celeb')); }
function weekOffsetFor(key) {
  var sel = fromKey(key), now = new Date();
  return Math.round((addDays(sel, -sel.getDay()) - addDays(now, -now.getDay())) / 604800000);
}
function shiftDay(n) {
  ui.sel = dkey(addDays(fromKey(ui.sel), n));
  ui.newOpen = false;
  ui.weekOffset = weekOffsetFor(ui.sel);
  suppressClickUntil = Date.now() + 450;
  render();
}
function clearDrag(el) {
  if (!el) return;
  el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; el.style.willChange = '';
}
/* run fn once, on the element's own transform transition (or after ms as a fallback) */
function afterTransition(el, fn, ms) {
  var run = once(function () { el.removeEventListener('transitionend', h); fn(); });
  var h = function (ev) {
    if (ev.target !== el) return;
    if (ev.propertyName && ev.propertyName !== 'transform') return;
    run();
  };
  el.addEventListener('transitionend', h);
  setTimeout(run, ms);
}
/* the current day slides out, the new day slides in from the other side */
function animateDay(dir, fromDx) {
  var el = screenEl(); if (!el) { shiftDay(dir); return; }
  var w = el.offsetWidth || 420;
  animating = true;
  el.style.willChange = 'transform';
  el.style.transition = 'none';
  el.style.transform = 'translateX(' + (fromDx || 0) + 'px)';
  void el.offsetWidth;
  el.style.transition = 'transform .16s cubic-bezier(.4,0,1,1), opacity .16s linear';
  el.style.transform = 'translateX(' + (dir > 0 ? w * 0.55 : -w * 0.55) + 'px)';
  el.style.opacity = '0';
  afterTransition(el, function () {
    el.style.transition = 'none';
    shiftDay(dir);
    el.style.transform = 'translateX(' + (dir > 0 ? -w * 0.3 : w * 0.3) + 'px)';
    el.style.opacity = '0';
    void el.offsetWidth;
    el.style.transition = 'transform .24s cubic-bezier(.22,.9,.28,1), opacity .24s ease-out';
    el.style.transform = 'translateX(0)';
    el.style.opacity = '1';
    afterTransition(el, function () { clearDrag(el); animating = false; }, 420);
  }, 380);
}
function snapBack() {
  var el = screenEl(); if (!el) return;
  el.style.transition = 'transform .24s cubic-bezier(.22,.9,.28,1), opacity .24s ease-out';
  el.style.transform = 'translateX(0)';
  el.style.opacity = '1';
  afterTransition(el, function () { clearDrag(el); }, 420);
}
function dragBegin(x, y) {
  drag.on = true; drag.x = x; drag.y = y; drag.dx = 0; drag.axis = null; drag.t = Date.now();
  var el = screenEl(); drag.w = el ? el.offsetWidth : 420;
}
function dragMove(x, y) {
  if (!drag.on) return false;
  var dx = x - drag.x, dy = y - drag.y;
  if (!drag.axis) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return false;
    drag.axis = Math.abs(dx) > Math.abs(dy) * 1.25 ? 'x' : 'y';
    if (drag.axis === 'y') { drag.on = false; return false; } /* let the page scroll */
    var el0 = screenEl();
    if (el0) { el0.style.transition = 'none'; el0.style.willChange = 'transform'; }
  }
  if (drag.axis !== 'x') return false;
  drag.dx = dx;
  var el = screenEl();
  if (el) {
    el.style.transform = 'translateX(' + dx + 'px)';
    el.style.opacity = String(Math.max(0.5, 1 - Math.abs(dx) / (drag.w * 1.7)));
  }
  return true;
}
function dragEnd() {
  if (!drag.on) return;
  var wasX = drag.axis === 'x', dx = drag.dx, dt = Date.now() - drag.t;
  drag.on = false;
  if (!wasX) return;
  var v = dt > 0 ? Math.abs(dx) / dt : 0;
  /* swipe right -> next day, swipe left -> previous day (RTL: later days sit to the left) */
  if (Math.abs(dx) > Math.max(56, drag.w * 0.16) || v > 0.55) animateDay(dx > 0 ? 1 : -1, dx);
  else snapBack();
}

/* touch */
document.addEventListener('touchstart', function (ev) {
  if (!swipeAllowed() || ev.touches.length !== 1 || swipeBlocked(ev.target)) { drag.on = false; return; }
  dragBegin(ev.touches[0].clientX, ev.touches[0].clientY);
}, { passive: true });
document.addEventListener('touchmove', function (ev) {
  if (!drag.on || !ev.touches[0]) return;
  if (dragMove(ev.touches[0].clientX, ev.touches[0].clientY) && ev.cancelable) ev.preventDefault();
}, { passive: false });
document.addEventListener('touchend', dragEnd, { passive: true });
document.addEventListener('touchcancel', function () { if (drag.on) { drag.on = false; snapBack(); } }, { passive: true });

/* mouse drag (desktop) */
document.addEventListener('mousedown', function (ev) {
  if (ev.button !== 0 || !swipeAllowed() || swipeBlocked(ev.target)) { drag.on = false; return; }
  ev.preventDefault(); /* keep text selection out of the way */
  dragBegin(ev.clientX, ev.clientY);
});
document.addEventListener('mousemove', function (ev) { if (drag.on) dragMove(ev.clientX, ev.clientY); });
document.addEventListener('mouseup', dragEnd);

/* trackpad horizontal scroll (desktop) */
document.addEventListener('wheel', function (ev) {
  if (!swipeAllowed() || Math.abs(ev.deltaX) <= Math.abs(ev.deltaY)) return;
  if (Date.now() < wheelLockUntil) return;
  wheelAcc += ev.deltaX;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(function () { wheelAcc = 0; }, 220);
  if (Math.abs(wheelAcc) >= 50) {
    var dir = wheelAcc < 0 ? 1 : -1; /* natural scrolling: two fingers to the right give negative deltaX */
    wheelAcc = 0; wheelLockUntil = Date.now() + 700;
    animateDay(dir, 0);
  }
}, { passive: true });

/* new day while the app stays open */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && dkey(new Date()) !== today0) { today0 = dkey(new Date()); ui.sel = today0; ui.weekOffset = 0; render(); }
});

render();
})();
</script>
</body>
</html>
